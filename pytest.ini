[pytest]
DJANGO_SETTINGS_MODULE = CPMS.settings
# Only collect from the app's tests package — do not wander into the local
# virtualenv (Lib/, Scripts/, Include/) or site-packages.
testpaths = managementsys/tests
norecursedirs = Lib Include Scripts .git *.egg-info node_modules
python_files = tests.py test_*.py *_tests.py
# --reuse-db keeps the test DB between runs (faster); drop it / add --create-db
# when models change. --nomigrations builds the schema straight from models so
# the 45 migrations don't have to replay on every run.
addopts = --reuse-db --nomigrations -q
